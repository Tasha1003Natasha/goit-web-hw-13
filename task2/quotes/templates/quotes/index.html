{% extends 'quotes/base.html' %} {% load extract %} {% block content %}

<div class="row" bis_skin_checked="1">
  <div class="col-md-8" bis_skin_checked="1">
    {% for quote in quotes %}
    <div
      class="quote"
      itemscope=""
      itemtype="http://schema.org/CreativeWork"
      bis_skin_checked="1"
    >
      <span class="text" itemprop="text">{{quote.quote}}</span>
      <span
        >by
        <small class="author" itemprop="author"
          >{{quote.author_id|author}}</small
        >
        <a href="{% url 'quotes:author_detail' quote.author_id %}">(about)</a>
      </span>
      <div class="tags" bis_skin_checked="1">
        Tags: {% for tag in quote.tags.all %}
        <a class="tag" href="/tag/{{ tag.name }}/">{{tag}}</a>
        {% endfor %}
      </div>
    </div>

    {% endfor %}
    <nav>
      <ul class="pager d-flex justify-content-between mt-4">
        <li class="previous btn-outline-secondary">
          <a
            class="{% if not quotes.has_previous %} disabled {% endif %}"
            href="{% if  quotes.has_previous %} {% url 'quotes:page' quotes.previous_page_number %} {% else %} # {% endif %} "
          >
            <span aria-hidden="true">&larr;</span> Previous
          </a>
        </li>

        <li class="next btn-outline-secondary">
          <a
            class="{% if not quotes.has_next %} disabled {% endif %}"
            href="{% if  quotes.has_next %} {% url 'quotes:page' quotes.next_page_number %} {% else %} # {% endif %} "
          >
            Next <span aria-hidden="true">&rarr;</span>
          </a>
        </li>
      </ul>
    </nav>
  </div>
</div>

{% endblock %}
