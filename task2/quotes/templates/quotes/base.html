<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    {% load static %}
    <link rel="stylesheet" href="{% static 'quotes/style.css' %}" />
    <title>Home work</title>
  </head>
  <body>
    <div class="container" bis_skin_checked="1">
      <div class="row header-box pt-3" bis_skin_checked="1">
        <div class="col-md-8" bis_skin_checked="1">
          <h1>
            <a href="/" style="text-decoration: none">Quotes to Scrape</a>
          </h1>
            {% if user.is_authenticated %}
            <div class="header-actions">
              <a href="{% url 'quotes:author' %}" class="btn btn-primary"
                >Add Author</a
              >
              <a href="{% url 'quotes:quote' %}" class="btn btn-primary"
                >Add Quote</a
              >
            </div>
            {% endif %}
        </div>
        <div
          class="col-md-4 d-flex flex-column align-items-end gap-2 ms-auto"
          bis_skin_checked="1"
        >
          <p>
            {% if user.is_authenticated %}
            <a href="{% url 'users:logout' %}" class="btn btn-primary"
              >Logout</a
            >
            {% else %}
            <a href="{% url 'users:signup' %}" class="btn btn-primary"
              >SignUp</a
            >
            <a href="{% url 'users:login' %}" class="btn btn-primary">Login</a>
            {% endif %}
          </p>
        </div>
      </div>

      {% block content %} {% endblock %}
    </div>
  </body>
</html>
